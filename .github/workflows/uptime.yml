name: Uptime Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  smoke:
    name: 定时健康检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行冒烟测试
        run: node tests/smoke-test.mjs
        env:
          SMOKE_API_BASE: https://blood-moon-blog-api.2198789717.workers.dev/api
          SMOKE_SITE: https://blood-moon-blog.pages.dev