# GitHub Actions 工作流 - 自动部署到 Cloudflare Pages
#
# 触发时机：推送到 master 分支时自动构建并部署
#
# 前置条件：
#   GitHub 仓库配置 Cloudflare API Token（Settings → Secrets and variables → Actions）
#   Key: CLOUDFLARE_API_TOKEN
#   Value: Cloudflare API Token（从 dash.cloudflare.com/profile/api-tokens 创建，需 Workers Scripts:Edit + Pages:Edit 权限）

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 环境变量（从 GitHub Secrets 读取）
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # 3. 安装前端依赖
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # 4. 构建前端
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 5. 安装 wrangler CLI
      - name: Install wrangler
        run: npm install -g wrangler

      # 6. 部署到 Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        working-directory: .
        run: wrangler pages deploy frontend/dist --project-name=blood-moon-blog

      # 7. 显示部署结果
      - name: API 冒烟测试
        run: node tests/smoke-test.mjs
        env:
          SMOKE_API_BASE: https://blood-moon-blog-api.2198789717.workers.dev/api
          SMOKE_SITE: https://blood-moon-blog.pages.dev

      - name: Deployment Summary
        run: |
          echo "✅ 部署成功！"
          echo "项目名：blood-moon-blog"
          echo "访问地址：https://blood-moon-blog.pages.dev"
