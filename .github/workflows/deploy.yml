/**
 * GitHub Actions 工作流 - 自动部署到 Cloudflare Pages
 * 
 * 触发时机：推送到 master 分支时自动构建并部署
 * 
 * 前置条件：
 *   1. GitHub 仓库配置 Cloudflare API Token（Settings → Secrets）
 *      Key: CLOUDFLARE_API_TOKEN
 *      Value: Cloudflare API Token（从 dash.cloudflare.com 获取）
 *   2. Cloudflare Account ID（Settings → Variables）
 *      Key: CLOUDFLARE_ACCOUNT_ID
 *      Value: 你的 Cloudflare 账号 ID
 */

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 环境变量（从 GitHub Secrets 读取）
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安装前端依赖
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # 4. 构建前端
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 5. 安装 wrangler CLI
      - name: Install wrangler
        run: npm install -g wrangler

      # 6. 部署到 Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        working-directory: .
        run: wrangler pages deploy frontend/dist --project-name=blood-moon-blog

      # 7. 显示部署结果
      - name: Deployment Summary
        run: |
          echo "✅ 部署成功！"
          echo "项目名：blood-moon-blog"
          echo "访问地址：https://blood-moon-blog.pages.dev"
